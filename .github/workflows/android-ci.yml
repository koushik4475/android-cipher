name: Android Cipher CI

on:
  push:
    branches: [main, "upgrade/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android 36 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Run tests, lint and assemble debug/release APKs
        run: bash gradlew --no-daemon clean testDebugUnitTest lintDebug assembleDebug assembleRelease

      - name: Upload debug and release APKs
        uses: actions/upload-artifact@v4
        with:
          name: android-cipher-apks
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
